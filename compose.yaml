services:
  imagechat:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Foundry__Endpoint: ${FOUNDRY_ENDPOINT:-}
      Foundry__Deployment: ${FOUNDRY_DEPLOYMENT:-gpt-image-2}
      Foundry__ApiKey: ${FOUNDRY_API_KEY:-}
      Foundry__AuthMode: ${FOUNDRY_AUTH_MODE:-ApiKey}
      Foundry__ApiStyle: ${FOUNDRY_API_STYLE:-deployments}
      Foundry__ApiVersion: ${FOUNDRY_API_VERSION:-2025-04-01-preview}
      Foundry__Mai__Endpoint: ${MAI_ENDPOINT:-}
      Foundry__Mai__Deployment: ${MAI_DEPLOYMENT:-mai-image-2.5-flash}
      Foundry__Mai__AuthMode: ${MAI_AUTH_MODE:-ApiKey}
      Foundry__Mai__ApiKey: ${MAI_API_KEY:-}
      Foundry__Flux__Endpoint: ${FLUX_ENDPOINT:-}
      Foundry__Flux__Deployment: ${FLUX_DEPLOYMENT:-FLUX.2-pro}
      Foundry__Flux__ApiVersion: ${FLUX_API_VERSION:-preview}
      Foundry__Flux__AuthMode: ${FLUX_AUTH_MODE:-ApiKey}
      Foundry__Flux__ApiKey: ${FLUX_API_KEY:-}
    volumes:
      - imagechat-data:/app/data
    restart: unless-stopped
volumes:
  imagechat-data: